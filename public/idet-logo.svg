<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 20 L160 40 L160 100 C160 140 130 170 100 180 C70 170 40 140 40 100 L40 40 Z" 
        fill="url(#shieldGradient)" 
        stroke="#4f46e5" 
        stroke-width="3"/>
  
  <!-- Document Icon -->
  <rect x="70" y="60" width="35" height="45" rx="3" fill="white" opacity="0.95"/>
  <line x1="75" y1="70" x2="100" y2="70" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="78" x2="100" y2="78" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="86" x2="95" y2="86" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Calendar Icon -->
  <rect x="95" y="75" width="35" height="40" rx="3" fill="white" opacity="0.95"/>
  <rect x="95" y="75" width="35" height="10" rx="3" fill="url(#accentGradient)"/>
  <circle cx="103" cy="95" r="2" fill="#6366f1"/>
  <circle cx="113" cy="95" r="2" fill="#6366f1"/>
  <circle cx="123" cy="95" r="2" fill="#6366f1"/>
  <circle cx="103" cy="105" r="2" fill="#6366f1"/>
  <circle cx="113" cy="105" r="2" fill="#10b981"/>
  <circle cx="123" cy="105" r="2" fill="#6366f1"/>
  
  <!-- Checkmark -->
  <circle cx="85" cy="95" r="12" fill="url(#accentGradient)"/>
  <path d="M80 95 L84 99 L91 92" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Alert Bell (small) -->
  <path d="M115 125 Q115 120 120 120 Q125 120 125 125 L125 130 Q125 133 122.5 135 Q120 137 117.5 135 Q115 133 115 130 Z" 
        fill="#f59e0b" opacity="0.9"/>
  <circle cx="120" cy="138" r="2" fill="#f59e0b"/>
</svg>
